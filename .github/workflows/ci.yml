name: CI

on:
  push:
    branches: [solo-arx, main]
  pull_request:
    branches: [solo-arx, main]

env:
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable (with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable (with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # ponytail: clippy on --all-targets would flag every research example;
      # library is the normative surface. Upgrade path: add --all-targets once
      # examples are cleaned up, or gate examples with #![allow(clippy::all)].
      - name: Clippy (library, -D warnings)
        run: cargo clippy --lib -- -D warnings
      - name: Clippy (tests)
        run: cargo clippy --tests -- -D warnings

  build-test:
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Restore cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Restore target cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'src/**', 'examples/**') }}
          restore-keys: |
            ${{ runner.os }}-target-
      - name: Check (all targets)
        run: cargo check --all-targets
      - name: Build (release, lib + examples)
        run: cargo build --release --all-targets
      - name: Test (all targets)
        run: cargo test --all-targets
      - name: Spec validation
        run: cargo run --release --example spec_validation
      - name: KAT roundtrip
        run: cargo run --release --example kat_roundtrip_check
      - name: KAT verify (all 4 vector files)
        run: cargo run --release --example kat_verify
